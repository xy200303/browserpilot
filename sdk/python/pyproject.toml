[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# PyPI 上 browserpilot 这个名字被一个 Selenium 时代的项目占了（0.2.53，作者 handrew），
# 所以发布名用 browserpilot-sdk；装完之后 import 的仍然是 browserpilot。
name = "browserpilot-sdk"
version = "0.19.0"
description = "Drive the BrowserPilot desktop browser from Python, Playwright style"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xy200303", email = "3483421977@qq.com" }]
keywords = ["browser", "automation", "mcp", "playwright", "browserpilot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xy200303/browserpilot"
Repository = "https://github.com/xy200303/browserpilot"
Documentation = "https://github.com/xy200303/browserpilot/blob/main/sdk/README.md"
Issues = "https://github.com/xy200303/browserpilot/issues"

[tool.setuptools]
packages = ["browserpilot"]
