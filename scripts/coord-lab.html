<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>坐标实验</title>
  <style>
    body { margin: 0; font-family: Segoe UI, sans-serif; }
    #hud {
      position: fixed; top: 8px; right: 8px; z-index: 2;
      width: 320px; padding: 12px; background: #111; color: #fff; font-size: 13px; line-height: 1.5;
    }
    button { display: block; margin: 24px; padding: 12px 16px; font-size: 16px; }
    .gap { height: 160vh; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="hud">
    <div>视口坐标的原点是当前可见区域左上角。</div>
    <div>页面坐标在此基础上加上滚动距离。</div>
    <div id="scroll"></div>
    <div id="log">还没有点击</div>
  </div>
  <button id="top" type="button">上方按钮</button>
  <div class="gap"></div>
  <button id="low" type="button">滚下来才看见</button>
  <div class="gap"></div>
  <script>
    function label(id) {
      const el = document.getElementById(id)
      const rect = el.getBoundingClientRect()
      el.dataset.view = Math.round(rect.left) + ',' + Math.round(rect.top)
      el.dataset.page = Math.round(rect.left + scrollX) + ',' + Math.round(rect.top + scrollY)
      el.textContent = id + ' 视口(' + el.dataset.view + ') 页面(' + el.dataset.page + ')'
    }
    function paint() {
      label('top')
      label('low')
      document.getElementById('scroll').textContent = 'scrollY ' + Math.round(scrollY)
    }
    addEventListener('scroll', paint)
    addEventListener('click', (event) => {
      const target = event.target
      document.getElementById('log').textContent =
        '点中 ' + (target.id || target.tagName) + '\n' +
        '视口 client ' + Math.round(event.clientX) + ',' + Math.round(event.clientY) + '\n' +
        '页面 page ' + Math.round(event.pageX) + ',' + Math.round(event.pageY)
    }, true)
    paint()
  </script>
</body>
</html>
