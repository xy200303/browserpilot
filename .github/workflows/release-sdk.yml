name: Release SDK

on:
  push:
    tags: ['sdk/v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建和测试，不发布'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Node SDK 的构建脚本用仓库根目录的 tsc
      - run: npm ci

      - name: 版本对齐检查
        run: node sdk/scripts/sync-version.mjs --check

      - name: tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#sdk/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag sdk/v$tag 和 package.json 的 $version 不一致"
            exit 1
          fi

      - name: 三套单元测试
        run: |
          cd sdk/node && node build.mjs && node test/sdk.test.mjs
          cd ../../sdk/python && python -m unittest discover -s tests
          cd ../go && go vet ./... && test -z "$(gofmt -l .)" && go test ./...

      - name: 发布到 npm
        if: github.ref_type == 'tag' && inputs.dry_run != true
        working-directory: sdk/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 构建 Python 包
        run: |
          python -m pip install --upgrade build
          cd sdk/python && python -m build

      - name: 发布到 PyPI
        if: github.ref_type == 'tag' && inputs.dry_run != true
        run: |
          python -m pip install --upgrade twine
          twine upload sdk/python/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      # Go 模块不发版：仓库里的 tag 就是版本。子目录模块的 tag 必须带目录前缀，
      # 否则 `go get github.com/xy200303/browserpilot/sdk/go@v0.19.0` 解析不到。
      - name: 打 Go 子模块 tag
        if: github.ref_type == 'tag' && inputs.dry_run != true
        run: |
          version="${GITHUB_REF_NAME#sdk/}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "sdk/go/${version}" || echo "tag 已存在"
          git push origin "sdk/go/${version}"
